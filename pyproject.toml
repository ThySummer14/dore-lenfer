[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dore-lenfer"
version = "1.0.0"
description = "DORÉ — L'ENFER: a procedurally generated engraving suite in the manner of Gustave Doré, with an invented-vision inspection toolkit. No image model, no neural network, no external API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ThySummer" }]
keywords = ["engraving", "procedural-art", "dore", "divine-comedy", "numpy", "pillow", "vision"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.scripts]
dore-eye = "dore.eye:main"

[tool.setuptools]
packages = ["dore"]
